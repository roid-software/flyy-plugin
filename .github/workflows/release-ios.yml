# Release cordova-plugin-theflyy for a new FlyyFramework (iOS) version.
# Run by hand (Actions -> Release (iOS SDK update)) or from flyy-ios-sdk's release workflow.
#
# Pins FlyyFramework in plugin.xml, bumps the patch version (package.json + plugin.xml), publishes
# to npm, then pushes "Releasing v<new>" + tag <new>.
#
# npm trusted publishing (OIDC), no token. One-time setup:
#   npm trust github cordova-plugin-theflyy --file release-ios.yml --repo roid-software/flyy-plugin --allow-publish

name: Release (iOS SDK update)

on:
  workflow_dispatch:
    inputs:
      flyy_framework_version:
        description: FlyyFramework (iOS) version to pin, e.g. 1.3.157
        required: true
      dry_run:
        description: Bump + npm publish --dry-run, no push
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit + tag
  id-token: write # npm trusted publishing

jobs:
  release:
    # GitHub-hosted on purpose: this repo is public, so npm publishes with provenance, and npm only
    # accepts provenance from GitHub-hosted runners (Blacksmith = "self-hosted" -> E422).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IOS: ${{ inputs.flyy_framework_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check FlyyFramework is on CocoaPods
        run: |
          set -euo pipefail
          [[ "$IOS" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "::error::Bad version: $IOS"; exit 1; }
          curl -sf https://trunk.cocoapods.org/api/v1/pods/FlyyFramework | grep -q "\"name\":\"$IOS\"" ||
            { echo "::error::FlyyFramework $IOS is not on CocoaPods trunk"; exit 1; }

      - name: Pin FlyyFramework and bump version
        id: bump
        run: |
          set -euo pipefail
          sed -i -E "s/(<pod name=\"FlyyFramework\" spec=\")[^\"]+\"/\1$IOS\"/" plugin.xml
          grep -q "<pod name=\"FlyyFramework\" spec=\"$IOS\"/>" plugin.xml || { echo "::error::FlyyFramework pin not found in plugin.xml"; exit 1; }
          NEW=$(npm version patch --no-git-tag-version)
          NEW=${NEW#v}
          sed -i -E "s/^( +version=\")[^\"]+(\">)/\1$NEW\2/" plugin.xml # <plugin ... version="x.y.z">
          [ "$(grep -c "version=\"$NEW\"" plugin.xml)" = 1 ] || { echo "::error::plugin.xml version not bumped"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Releasing v$NEW (FlyyFramework $IOS)"
          git tag "$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "cordova-plugin-theflyy $NEW -> FlyyFramework $IOS"

      - name: Publish to npm
        run: |
          npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
          npm publish ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Push release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          NEW: ${{ steps.bump.outputs.version }}
        run: git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$NEW"
